name        = "ticket-links"
version     = "0.2.0"
description = "Opens the ticket a line mentions"
entry       = "index.js"
slots       = ["item.badge"]

[permissions]
capabilities = ["shell.open"]

[permissions.open]
urls = ["settings.url"]

[settings.pattern]
label   = "Ticket pattern"
kind    = "text"
default = "#(\\d+)"

[settings.url]
label   = "Ticket URL"
kind    = "text"
hint    = "https://github.com/org/repo/pull/$1"
