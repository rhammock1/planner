name        = "meeting-notes"
version     = "0.1.1"
description = "A block under the day for each meeting, kept in a file beside it"
entry       = "index.js"
slots       = ["page.section", "search.provide"]

# One line, because `core/toml.js` reads single-line arrays and nothing else.
[permissions]
capabilities = ["macos.calendar.read", "vault.sidecar.read"]

# Every file this plugin may name begins `meeting`. Nothing else may name one,
# and it may name nothing else.
[sidecars]
prefixes = ["meeting"]
