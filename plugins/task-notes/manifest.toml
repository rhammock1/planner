name        = "task-notes"
version     = "0.1.0"
description = "A page of your own about a line, and a marker on the line"
entry       = "index.js"
slots       = ["item.action", "item.badge", "page.section"]

# One line, because `core/toml.js` reads single-line arrays and nothing else.
[permissions]
capabilities = ["vault.sidecar.read"]

# What the ⌘, pane calls the gesture this plugin adds to a line.
[action]
label = "Notes"

# Every file this plugin may name begins `note`. Nothing else may name one,
# and it may name nothing else.
[sidecars]
prefixes = ["note"]
