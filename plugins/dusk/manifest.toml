name        = "dusk"
version     = "0.2.0"
description = "The sky on the page: twilight over the surfaces, and a night page after civil dusk"
entry       = "index.js"
slots       = ["theme.tokens"]

# Nine, where 0.1.0 named six. Growing this list grants nothing: `texture`,
# `accent` and `alert` arrive unticked and are refused until somebody says
# otherwise, so anyone already running dusk ticks the three once in the ⌘,
# pane. That is the rule working, not a migration.
#
# One line, because `core/toml.js` reads single-line arrays and nothing else -
# a list broken over several lines parses as no list at all, and a plugin that
# declared nothing is refused every colour it answers with.
[tokens]
moves = ["paper", "surface", "edge", "edge-soft", "ink", "dim", "accent", "alert", "texture"]

[permissions]
capabilities = ["macos.location.read"]

# No default on purpose: an author's coordinates would warm somebody else's
# evening at the wrong hour, and a plugin quietly using Charlotte's sunset in
# Berlin is worse than one that says it does not know.
#
# The hint is a format and not a pair of numbers for the same reason. A
# plausible-looking coordinate in a greyed-out box is read as the answer the
# field already has, and it gets typed in - which is the default arriving by
# the other door, and worse than a default because nobody chose it.
[settings.location]
label = "Where this Mac is"
kind  = "text"
hint  = "latitude,longitude"
