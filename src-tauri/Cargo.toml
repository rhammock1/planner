[package]
name = "planner"
version = "0.1.0"
description = "A macOS menu bar daily planner"
edition = "2021"
rust-version = "1.77"

[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# For one call: killing a process group. `Child::kill` reaches the child this
# app started and not whatever that child started, and a command that overran
# has to leave nothing behind (spec §3.2).
libc = "0.2"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"
objc2 = "0.6"
# Only the classes this app touches. The default feature set drags in
# MapKit, AppKit and CoreLocation, none of which a planner has any business
# linking against.
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKTypes",
] }
objc2-foundation = "0.3"
# Only the two classes this app touches, for the same reason the EventKit
# dependency above is narrowed: the default feature set drags in geocoding,
# beacons and region monitoring, none of which a planner has any business
# linking against.
objc2-core-location = { version = "0.3", default-features = false, features = [
    "std",
    "CLLocation",
    "CLLocationManager",
] }
block2 = "0.6"
# So that `planner <path>` typed a second time reaches the app that is already
# running rather than starting another one. On macOS the plugin keys its
# socket on the bundle identifier - /tmp/io_hammock_planner_si.sock - so the
# bare debug binary and Planner.app are correctly treated as the same app.
tauri-plugin-single-instance = "2"
