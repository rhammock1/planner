[package]
name = "planner"
version = "0.1.0"
description = "A macOS menu bar daily planner"
edition = "2021"
rust-version = "1.77"

[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"
objc2 = "0.6"
# Only the classes this app touches. The default feature set drags in
# MapKit, AppKit and CoreLocation, none of which a planner has any business
# linking against.
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKTypes",
] }
objc2-foundation = "0.3"
block2 = "0.6"
